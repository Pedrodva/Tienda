<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00E676">
    <title>Tienda | RevUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- CABECERA con el logo y el botón de la cesta -->
    <header id="cabecera">
        <div class="cabecera">
            <a href="#" class="logo">
                <span class="logo_texto">Rev<span>Up</span></span>
                <span class="logo_pill"><span class="punto"></span>Store</span>
            </a>
            <button id="ver_cesta" class="boton_cesta" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
                </svg>
                <span>Ver Cesta</span>
                <!-- Aquí el JS pone cuántos productos hay en la cesta -->
                <span id="contador-cesta" class="burbuja" aria-label="artículos en la cesta">0</span>
            </button>
        </div>
    </header>

    <main class="principal">
        <!-- PRESENTACIÓN -->
        <section class="hero">
            <p class="hero_pre">Tienda oficial</p>
            <h1>Equípate para <span class="acento">rodar al máximo</span></h1>
            <p class="hero_texto">Suscripciones para llevar tus rutas y la potencia de la aplicación al máximo nivel.</p>
        </section>

        <!-- FILTROS, BUSCADOR Y ORDEN -->
        <section class="herramientas" aria-label="Filtros del catálogo">
            <!-- Los botones de categoría los crea el JS a partir del JSON -->
            <div id="filtros" class="filtros" role="group" aria-label="Categorias"></div>

            <div class="herramientas_derecha">
                <input id="buscador" class="campo" type="text" placeholder="Buscar productos..." aria-label="Buscar productos">
                <select id="orden" class="campo" aria-label="Ordenar productos">
                    <option value="defecto">Ordenar por...</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                    <option value="nombre">Nombre: A-Z</option>
                </select>
            </div>
        </section>

        <!-- CATÁLOGO: el JS mete aquí una tarjeta por producto -->
        <section id="catalogo" class="catalogo" aria-live="polite"></section>
    </main>

    <footer class="pie">© RevUp Store</footer>

    <!-- MODAL DE LA CESTA (está oculto hasta que se pulsa "Ver Cesta") -->
    <div id="modal" class="modal" hidden>
        <div class="modal_fondo" data-cerrar></div>
        <div class="modal_caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal_cabecera">
                <h2 id="modal-titulo">Tu cesta</h2>
                <button class="boton_icono" data-cerrar aria-label="cerrar">✕</button>
            </div>
            <!-- Datos de envío sacados de userData.json -->
            <p id="envio" class="envio"></p>
            <ul id="lista-cesta" class="lista-cesta"></ul>
            <div class="modal_pie">
                <div class="total">
                    <span>Total</span>
                    <strong id="total">0,00€</strong>
                </div>
                <button id="finalizar" class="boton_principal">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Mensaje pequeño que sale al añadir algo -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <!-- Antes ponía " script.js " con espacios y no cargaba -->
    <script src="script.js"></script>
</body>

</html>
